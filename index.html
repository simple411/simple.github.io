<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的0元网站</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:#161b22;
            color:#f0f6fc;
            font-family:system-ui, sans-serif;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
        }
        .box{
            text-align:center;
            padding:40px;
            border:1px solid #30363d;
            border-radius:12px;
            background:#21262d;
        }
        h1{
            font-size:2.2rem;
            margin-bottom:16px;
            color:#58a6ff;
        }
        p{
            font-size:1rem;
            color:#8b949e;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎉网站部署成功</h1>
        <p>由 Cloudflare Pages / GitHub Pages 提供服务</p>
        <p style="margin-top:12px;">你可以修改这个 index.html 改成你自己的页面</p>
    </div>
</body>
</html>
